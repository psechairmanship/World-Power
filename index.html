<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      background: linear-gradient(to right, #0ff, #0f0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.2em;
      max-width: 600px;
      margin-bottom: 30px;
    }
    a.button {
      display: inline-block;
      padding: 15px 30px;

      color: black;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      transition: background 0.3s;
    }
    a.button:hover {
      background-color: #00cc7a;
    }
    footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.9em;
      color: #777;
    }
